<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSS Transform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf8;
    --panel: #ffffff;
    --line: #e2e0d9;
    --ink: #1e1d1a;
    --muted: #79766c;
    --accent: #3454d1;
    --accent-2: #d1345a;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --display: 'Space Grotesk', -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }

  header { margin-bottom: 30px; }
  .tag {
    display: inline-block;
    font-size: 11.5px;
    letter-spacing: 0.03em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 8px;
    border-radius: 2px;
    margin-bottom: 14px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(26px, 5.5vw, 38px);
    margin: 0 0 12px;
    line-height: 1.1;
    color: var(--ink);
  }
  header p {
    color: var(--muted);
    max-width: 56ch;
    line-height: 1.65;
    margin: 0;
    font-size: 14.5px;
  }

  .stage-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 560px) {
    .stage-row { grid-template-columns: 1fr; }
    .arrow { transform: rotate(90deg); justify-self: center; }
  }

  .stage {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 220px;
    box-shadow: 0 1px 2px rgba(30, 29, 26, 0.04);
  }
  .stage-label {
    align-self: flex-start;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .stage-box-holder {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 600px;
  }
  .box {
    width: 86px;
    height: 86px;
    border-radius: 8px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .box.after {
    background: var(--accent-2);
  }
  .arrow {
    font-size: 20px;
    color: var(--muted);
  }

  .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow: 0 1px 2px rgba(30, 29, 26, 0.04);
  }
  .btn-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  @media (max-width: 560px) {
    .btn-grid { grid-template-columns: repeat(2, 1fr); }
  }
  button {
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 12px 10px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.reset {
    color: var(--accent-2);
    border-color: var(--accent-2);
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .box { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>CSS Transform/Translate</h1>
  </header>

  <div class="stage-row">
    <div class="stage">
      <span class="stage-label">before</span>
      <div class="stage-box-holder"><div class="box">box</div></div>
    </div>
    <div class="arrow">→</div>
    <div class="stage">
      <span class="stage-label">after</span>
      <div class="stage-box-holder"><div class="box after" id="previewBox">box</div></div>
    </div>
  </div>

  <div class="controls">
    <div class="btn-grid">
      <button data-type="translate">Translate</button>
      <button data-type="rotate">Rotate</button>
      <button data-type="skew">Skew</button>
      <button data-type="scale">Scale</button>
      <button class="reset" id="resetBtn">Reset</button>
    </div>
  </div>

</div>

<script>
  const box = document.getElementById('previewBox');
  const buttons = document.querySelectorAll('.btn-grid button[data-type]');

  const presets = {
    translate: 'translate(40px, -20px)',
    rotate:    'rotate(45deg)',
    skew:      'skew(20deg, 8deg)',
    scale:     'scale(1.35)',
  };

  let active = null;

  function render() {
    box.style.transform = active ? presets[active] : 'none';
    buttons.forEach(b => b.classList.toggle('active', b.dataset.type === active));
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.type;
      active = (active === type) ? null : type;
      render();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    active = null;
    render();
  });

  render();
</script>
</body>
</html>
